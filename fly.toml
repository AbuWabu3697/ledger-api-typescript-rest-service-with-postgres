# fly.toml — Fly.io app configuration
# Deploy with: fly deploy
# Secrets: fly secrets set JWT_SECRET=... JWT_REFRESH_SECRET=...

app = "ledger-api"
primary_region = "iad"

[build]

[env]
  PORT = "3000"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/health"
    protocol = "https"
    timeout = "5s"
